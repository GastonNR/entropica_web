<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama - Flujo de Actividades</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: white;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .diagram-container {
            width: 100%;
            max-width: 950px;
        }
        .diagram-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 2rem;
            color: #111827;
        }
        svg {
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="diagram-container">
        <h2 class="diagram-title">✅ Flujo Detallado de Actividades</h2>
        <svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
            <!-- Fondo -->
            <rect width="1000" height="650" fill="#f9fafb"/>
            
            <!-- Título de actividades -->
            <text x="50" y="35" font-size="13" font-weight="600" fill="#111827">📋 Desglose por Fase:</text>
            
            <!-- FASE 1: ENTRADA - Columna 1 -->
            <rect x="30" y="50" width="180" height="550" rx="6" fill="#dbeafe" opacity="0.2"/>
            <text x="120" y="75" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">FASE 1: ENTRADA</text>
            <text x="120" y="95" text-anchor="middle" font-size="10" fill="#3b82f6">Tiempo: 4h</text>
            
            <rect x="45" y="105" width="150" height="60" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
            <text x="120" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#0c4a6e">Actividad 1.1</text>
            <text x="120" y="140" text-anchor="middle" font-size="10" fill="#0284c7">Config. Fuentes</text>
            <text x="120" y="155" text-anchor="middle" font-size="9" fill="#0284c7">2h</text>
            
            <rect x="45" y="175" width="150" height="60" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
            <text x="120" y="195" text-anchor="middle" font-size="11" font-weight="600" fill="#0c4a6e">Actividad 1.2</text>
            <text x="120" y="210" text-anchor="middle" font-size="10" fill="#0284c7">Extraer Datos</text>
            <text x="120" y="225" text-anchor="middle" font-size="9" fill="#0284c7">1h 30m</text>
            
            <rect x="45" y="245" width="150" height="60" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
            <text x="120" y="265" text-anchor="middle" font-size="11" font-weight="600" fill="#0c4a6e">Actividad 1.3</text>
            <text x="120" y="280" text-anchor="middle" font-size="10" fill="#0284c7">Integración</text>
            <text x="120" y="295" text-anchor="middle" font-size="9" fill="#0284c7">30m</text>
            
            <!-- FASE 2: PROCESAMIENTO - Columna 2 -->
            <rect x="230" y="50" width="180" height="550" rx="6" fill="#d1fae5" opacity="0.2"/>
            <text x="320" y="75" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">FASE 2: PROCESAMIENTO</text>
            <text x="320" y="95" text-anchor="middle" font-size="10" fill="#059669">Tiempo: 3h 30m</text>
            
            <rect x="245" y="105" width="150" height="60" rx="4" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1"/>
            <text x="320" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#134e4a">Actividad 2.1</text>
            <text x="320" y="140" text-anchor="middle" font-size="10" fill="#14b8a6">Análisis</text>
            <text x="320" y="155" text-anchor="middle" font-size="9" fill="#14b8a6">1h 30m</text>
            
            <rect x="245" y="175" width="150" height="60" rx="4" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1"/>
            <text x="320" y="195" text-anchor="middle" font-size="11" font-weight="600" fill="#134e4a">Actividad 2.2</text>
            <text x="320" y="210" text-anchor="middle" font-size="10" fill="#14b8a6">Limpieza Datos</text>
            <text x="320" y="225" text-anchor="middle" font-size="9" fill="#14b8a6">1h</text>
            
            <rect x="245" y="245" width="150" height="60" rx="4" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1"/>
            <text x="320" y="265" text-anchor="middle" font-size="11" font-weight="600" fill="#134e4a">Actividad 2.3</text>
            <text x="320" y="280" text-anchor="middle" font-size="10" fill="#14b8a6">Transformación</text>
            <text x="320" y="295" text-anchor="middle" font-size="9" fill="#14b8a6">1h</text>
            
            <!-- FASE 3: VALIDACIÓN - Columna 3 -->
            <rect x="430" y="50" width="180" height="550" rx="6" fill="#fce7f3" opacity="0.2"/>
            <text x="520" y="75" text-anchor="middle" font-size="12" font-weight="700" fill="#831843">FASE 3: VALIDACIÓN</text>
            <text x="520" y="95" text-anchor="middle" font-size="10" fill="#be185d">Tiempo: 2h</text>
            
            <rect x="445" y="105" width="150" height="60" rx="4" fill="#fbcfe8" stroke="#db2777" stroke-width="1"/>
            <text x="520" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#831843">Actividad 3.1</text>
            <text x="520" y="140" text-anchor="middle" font-size="10" fill="#db2777">Validación QA</text>
            <text x="520" y="155" text-anchor="middle" font-size="9" fill="#db2777">1h</text>
            
            <rect x="445" y="175" width="150" height="60" rx="4" fill="#fbcfe8" stroke="#db2777" stroke-width="1"/>
            <text x="520" y="195" text-anchor="middle" font-size="11" font-weight="600" fill="#831843">Actividad 3.2</text>
            <text x="520" y="210" text-anchor="middle" font-size="10" fill="#db2777">Revisión Final</text>
            <text x="520" y="225" text-anchor="middle" font-size="9" fill="#db2777">1h</text>
            
            <!-- FASE 4: ENTREGA - Columna 4 -->
            <rect x="630" y="50" width="180" height="550" rx="6" fill="#fef3c7" opacity="0.2"/>
            <text x="720" y="75" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">FASE 4: ENTREGA</text>
            <text x="720" y="95" text-anchor="middle" font-size="10" fill="#b45309">Tiempo: 1h</text>
            
            <rect x="645" y="105" width="150" height="60" rx="4" fill="#fef08a" stroke="#eab308" stroke-width="1"/>
            <text x="720" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#713f12">Actividad 4.1</text>
            <text x="720" y="140" text-anchor="middle" font-size="10" fill="#b45309">Formateo Output</text>
            <text x="720" y="155" text-anchor="middle" font-size="9" fill="#b45309">30m</text>
            
            <rect x="645" y="175" width="150" height="60" rx="4" fill="#fef08a" stroke="#eab308" stroke-width="1"/>
            <text x="720" y="195" text-anchor="middle" font-size="11" font-weight="600" fill="#713f12">Actividad 4.2</text>
            <text x="720" y="210" text-anchor="middle" font-size="10" fill="#b45309">Distribución</text>
            <text x="720" y="225" text-anchor="middle" font-size="9" fill="#b45309">30m</text>
            
            <!-- FASE 5: MONITOREO - Columna 5 -->
            <rect x="830" y="50" width="160" height="550" rx="6" fill="#c7d2fe" opacity="0.2"/>
            <text x="910" y="75" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">FASE 5: MONITOREO</text>
            <text x="910" y="95" text-anchor="middle" font-size="10" fill="#4f46e5">Contínuo</text>
            <text x="910" y="115" text-anchor="middle" font-size="10" fill="#4f46e5">(Paralelo)</text>
            
            <rect x="845" y="135" width="130" height="70" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
            <text x="910" y="160" text-anchor="middle" font-size="11" font-weight="600" fill="#3730a3">📊 Monitoreo</text>
            <text x="910" y="177" text-anchor="middle" font-size="9" fill="#4f46e5">• Performance</text>
            <text x="910" y="190" text-anchor="middle" font-size="9" fill="#4f46e5">• Errores</text>
            <text x="910" y="203" text-anchor="middle" font-size="9" fill="#4f46e5">• Alertas</text>
            
            <!-- Estadísticas Generales -->
            <text x="50" y="370" font-size="12" font-weight="600" fill="#111827">📈 Estadísticas Generales:</text>
            
            <rect x="50" y="385" width="940" height="90" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
            
            <!-- Fila 1 -->
            <rect x="65" y="400" width="12" height="12" rx="2" fill="#0284c7"/>
            <text x="85" y="411" font-size="11" fill="#374151"><tspan font-weight="600">Tiempo Total:</tspan> 11h 30m (sin paralelización)</text>
            
            <text x="500" y="411" font-size="11" fill="#374151"><tspan font-weight="600">Tiempo Real:</tspan> ~9 horas (optimizado)</text>
            
            <!-- Fila 2 -->
            <rect x="65" y="431" width="12" height="12" rx="2" fill="#d1d5db"/>
            <text x="85" y="442" font-size="11" fill="#374151"><tspan font-weight="600">Actividades Críticas:</tspan> 6 (camino crítico)</text>
            
            <text x="500" y="442" font-size="11" fill="#374151"><tspan font-weight="600">Proactividades Paralelas:</tspan> Monitoreo contínuo</text>
            
            <!-- Fila 3 -->
            <rect x="65" y="462" width="12" height="12" rx="2" fill="#14b8a6"/>
            <text x="85" y="473" font-size="11" fill="#374151"><tspan font-weight="600">Recurso Principal:</tspan> 4 personas / 2 equipos</text>
            
            <text x="500" y="473" font-size="11" fill="#374151"><tspan font-weight="600">Escalabilidad:</tspan> Lineal (agregar recursos = menos tiempo)</text>
            
            <!-- Relaciones de dependencia -->
            <text x="50" y="510" font-size="12" font-weight="600" fill="#111827">🔗 Dependencias y Relaciones:</text>
            
            <rect x="50" y="525" width="940" height="105" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
            
            <text x="65" y="545" font-size="11" fill="#374151"><tspan font-weight="600">→ Fase 1 (Entrada)</tspan> debe completarse 100% antes de Fase 2</text>
            
            <text x="65" y="565" font-size="11" fill="#374151"><tspan font-weight="600">→ Fase 2 (Procesamiento)</tspan> y <tspan font-weight="600">Fase 5 (Monitoreo)</tspan> se ejecutan en paralelo</text>
            
            <text x="65" y="585" font-size="11" fill="#374151"><tspan font-weight="600">→ Fase 3 (Validación)</tspan> inicia cuando Fase 2 está 100% completa</text>
            
            <text x="65" y="605" font-size="11" fill="#374151"><tspan font-weight="600">→ Fase 4 (Entrega)</tspan> comienza solo si Fase 3 aprueba QA. Si falla, retorna a Fase 2</text>
            
            <text x="65" y="625" font-size="11" fill="#374151"><tspan font-weight="600">→ Fase 5 (Monitoreo)</tspan> continúa durante todo el proceso y post-entrega</text>
        </svg>
    </div>
</body>
</html>
