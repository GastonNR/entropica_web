<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama - Flujo de Trabajo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: white;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .diagram-container {
            width: 100%;
            max-width: 900px;
        }
        .diagram-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 2rem;
            color: #111827;
        }
        svg {
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="diagram-container">
        <h2 class="diagram-title">📊 Flujo de Trabajo General</h2>
        <svg viewBox="0 0 950 550" xmlns="http://www.w3.org/2000/svg">
            <!-- Fondo -->
            <rect width="950" height="550" fill="#f9fafb"/>
            
            <!-- INICIO -->
            <circle cx="50" cy="50" r="20" fill="#10b981" stroke="#059669" stroke-width="2"/>
            <text x="50" y="60" text-anchor="middle" font-size="14" font-weight="700" fill="white">▶</text>
            
            <!-- Línea conexión 1 -->
            <line x1="70" y1="50" x2="130" y2="50" stroke="#d1d5db" stroke-width="2" marker-end="url(#arrowhead)"/>
            
            <!-- PASO 1: Solicitud -->
            <rect x="130" y="20" width="140" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
            <text x="200" y="40" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">1. Recibir</text>
            <text x="200" y="58" text-anchor="middle" font-size="11" fill="#3b82f6">Solicitud</text>
            
            <!-- Línea conexión 2 -->
            <line x1="270" y1="50" x2="330" y2="50" stroke="#d1d5db" stroke-width="2" marker-end="url(#arrowhead)"/>
            
            <!-- PASO 2: Validación -->
            <rect x="330" y="20" width="140" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
            <text x="400" y="40" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">2. Validar</text>
            <text x="400" y="58" text-anchor="middle" font-size="11" fill="#3b82f6">Entrada</text>
            
            <!-- Línea conexión 3 -->
            <line x1="470" y1="50" x2="530" y2="50" stroke="#d1d5db" stroke-width="2" marker-end="url(#arrowhead)"/>
            
            <!-- Decisión: Válido? -->
            <polygon points="595,35 630,50 595,65 560,50" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
            <text x="595" y="55" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">¿Válido?</text>
            
            <!-- Si NO (izq) -->
            <line x1="560" y1="50" x2="520" y2="140" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowhead-red)"/>
            <text x="530" y="90" font-size="10" fill="#dc2626">NO</text>
            
            <!-- Si SÍ (abajo) -->
            <line x1="595" y1="65" x2="595" y2="120" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead-green)"/>
            <text x="610" y="95" font-size="10" fill="#059669">SÍ</text>
            
            <!-- Rechazo -->
            <rect x="430" y="140" width="180" height="60" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
            <text x="520" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">❌ Rechazar</text>
            <text x="520" y="178" text-anchor="middle" font-size="11" fill="#dc2626">Notificar Usuario</text>
            
            <!-- PASO 3: Procesar -->
            <rect x="525" y="120" width="140" height="60" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
            <text x="595" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">3. Procesar</text>
            <text x="595" y="158" text-anchor="middle" font-size="11" fill="#059669">Datos</text>
            
            <!-- Línea conexión procesamiento -->
            <line x1="595" y1="180" x2="595" y2="220" stroke="#d1d5db" stroke-width="2" marker-end="url(#arrowhead)"/>
            
            <!-- PASO 4: Transformar -->
            <rect x="525" y="220" width="140" height="60" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
            <text x="595" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">4. Transformar</text>
            <text x="595" y="258" text-anchor="middle" font-size="11" fill="#059669">Información</text>
            
            <!-- Línea conexión QA -->
            <line x1="595" y1="280" x2="595" y2="320" stroke="#d1d5db" stroke-width="2" marker-end="url(#arrowhead)"/>
            
            <!-- PASO 5: Control QA -->
            <rect x="525" y="320" width="140" height="60" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
            <text x="595" y="340" text-anchor="middle" font-size="12" font-weight="600" fill="#831843">5. Control QA</text>
            <text x="595" y="358" text-anchor="middle" font-size="11" fill="#be185d">Validación</text>
            
            <!-- Decisión: Calidad OK? -->
            <line x1="595" y1="380" x2="595" y2="420" stroke="#d1d5db" stroke-width="2" marker-end="url(#arrowhead)"/>
            <polygon points="660,405 695,420 660,435 625,420" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
            <text x="660" y="425" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">¿OK?</text>
            
            <!-- Si NO QA (arriba) -->
            <line x1="625" y1="420" x2="450" y2="350" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowhead-red)"/>
            <text x="520" y="380" font-size="10" fill="#dc2626">NO</text>
            <text x="480" y="340" font-size="10" fill="#dc2626">Correción</text>
            
            <!-- Corrección -->
            <rect x="340" y="320" width="140" height="60" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
            <text x="410" y="340" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">⚠️ Iteración</text>
            <text x="410" y="358" text-anchor="middle" font-size="10" fill="#dc2626">Volver a paso 3</text>
            
            <!-- Si SÍ QA (abajo) -->
            <line x1="660" y1="435" x2="660" y2="480" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead-green)"/>
            <text x="675" y="460" font-size="10" fill="#059669">SÍ</text>
            
            <!-- PASO 6: Entregar -->
            <rect x="590" y="480" width="140" height="60" rx="6" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/>
            <text x="660" y="500" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">6. Entregar</text>
            <text x="660" y="518" text-anchor="middle" font-size="11" fill="#4f46e5">Resultados</text>
            
            <!-- Línea hacia fin -->
            <line x1="730" y1="510" x2="780" y2="510" stroke="#d1d5db" stroke-width="2" marker-end="url(#arrowhead)"/>
            
            <!-- FIN -->
            <circle cx="810" cy="510" r="20" fill="#10b981" stroke="#059669" stroke-width="2"/>
            <text x="810" y="520" text-anchor="middle" font-size="14" font-weight="700" fill="white">☑</text>
            
            <!-- Estadísticas laterales -->
            <text x="760" y="40" font-size="12" font-weight="600" fill="#111827">Tiempos:</text>
            <rect x="760" y="50" width="170" height="120" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
            <text x="775" y="70" font-size="11" fill="#374151">• Paso 1: 15 min</text>
            <text x="775" y="88" font-size="11" fill="#374151">• Paso 2-3: 5 min</text>
            <text x="775" y="106" font-size="11" fill="#374151">• Paso 4-5: 8 hrs</text>
            <text x="775" y="124" font-size="11" fill="#374151">• Paso 6: 30 min</text>
            <text x="775" y="142" font-size="10" font-weight="600" fill="#111827">Total: ~9 hrs</text>
            
            <!-- Tasa error -->
            <text x="760" y="210" font-size="12" font-weight="600" fill="#111827">Métricas:</text>
            <rect x="760" y="220" width="170" height="100" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
            <text x="775" y="240" font-size="11" fill="#374151">✓ Éxito: 96%</text>
            <text x="775" y="258" font-size="11" fill="#374151">⚠ Rechazo: 2%</text>
            <text x="775" y="276" font-size="11" fill="#374151">🔄 Iteración: 2%</text>
            <text x="775" y="294" font-size="11" fill="#374151">⏱ SLA: 24 hrs</text>
            
            <!-- Leyenda -->
            <text x="50" y="490" font-size="12" font-weight="600" fill="#111827">Leyenda de colores:</text>
            <rect x="50" y="505" width="680" height="30" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
            <rect x="65" y="513" width="14" height="14" rx="2" fill="#dbeafe" stroke="#3b82f6"/>
            <text x="85" y="523" font-size="10" fill="#374151">Entrada/Validación</text>
            
            <rect x="265" y="513" width="14" height="14" rx="2" fill="#d1fae5" stroke="#10b981"/>
            <text x="285" y="523" font-size="10" fill="#374151">Procesamiento</text>
            
            <rect x="465" y="513" width="14" height="14" rx="2" fill="#fce7f3" stroke="#ec4899"/>
            <text x="485" y="523" font-size="10" fill="#374151">Control QA</text>
            
            <rect x="595" y="513" width="14" height="14" rx="2" fill="#c7d2fe" stroke="#6366f1"/>
            <text x="615" y="523" font-size="10" fill="#374151">Entrega</text>
            
            <!-- Arrow markers -->
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#d1d5db"/>
                </marker>
                <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#10b981"/>
                </marker>
                <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#ef4444"/>
                </marker>
            </defs>
        </svg>
    </div>
</body>
</html>
